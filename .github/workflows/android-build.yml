name: Build and Release Android App (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: 'android-build'
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/frontend/varakoto-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/frontend/varakoto-web
        run: npm ci

      - name: Build Web Application
        working-directory: src/frontend/varakoto-web
        run: |
          npx ng build --configuration production --base-href /VaraKoto.com/
          cp dist/varakoto-web/browser/index.html dist/varakoto-web/browser/404.html
          touch dist/varakoto-web/browser/.nojekyll

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sync Capacitor Android Project
        working-directory: src/frontend/varakoto-web
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x mobile-app/android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: mobile-app/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log || {
            echo "## ❌ Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prepare APK Output
        run: |
          mkdir -p dist-apk
          APK_FILE=$(find mobile-app/android -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in mobile-app/android!"
            find mobile-app/android -type f | grep -E "build|outputs" || true
            exit 1
          fi
          echo "Found compiled APK at: $APK_FILE"
          cp "$APK_FILE" dist-apk/VaraKoto.apk
          mkdir -p src/frontend/varakoto-web/dist/varakoto-web/browser/downloads
          cp dist-apk/VaraKoto.apk src/frontend/varakoto-web/dist/varakoto-web/browser/downloads/varakoto.apk
          cp dist-apk/VaraKoto.apk src/frontend/varakoto-web/dist/varakoto-web/browser/downloads/VaraKoto.apk
          echo "## ✅ Android APK Build Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Location**: $APK_FILE" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $(du -h dist-apk/VaraKoto.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaraKoto-Android-APK
          path: dist-apk/VaraKoto.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: VaraKoto Android App v1.0.0
          body: |
            ### 🚗 VaraKoto.com অফিসিয়াল অ্যান্ড্রয়েড মোবাইল অ্যাপ্লিকেশন (APK)
            
            - **ভার্সন**: v1.0.0
            - **সাপোর্ট**: Android 7.0+ (Nougat থেকে Android 15/16)
            - **ফিচারস**:
              - ⚡ রিয়েলটাইম ৫-সেকেন্ড ক্যানভাস রোড অ্যানিমেশন (৬০ FPS)
              - 🚌 বাস, রিকশা, সিএনজি ও বাইক সঠিক ভাড়া ক্যালকুলেটর
              - 📍 হাই-অ্যাকিউরেসি জিপিএস কারেন্ট লোকেশন ডিটেকশন
              - 📳 বাটন ও ভেইকল সিলেকশনে নেটিভ টাচ হ্যাপটিক্স
              - 📲 হোয়াটসঅ্যাপ ও বন্ধুদের সাথে সরাসরি ভাড়া শেয়ার
              - 🌓 প্রিমিয়াম ডার্ক ও লাইট থিম
          files: dist-apk/VaraKoto.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: src/frontend/varakoto-web/dist/varakoto-web/browser
          destination_dir: ''
          keep_files: false
