name: Build Android Mobile App (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - 'src/frontend/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

concurrency:
  group: 'android-build'
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/frontend/varakoto-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/frontend/varakoto-web
        run: npm ci

      - name: Build Web Application
        working-directory: src/frontend/varakoto-web
        run: npx ng build --configuration production

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sync Capacitor Android Project
        working-directory: src/frontend/varakoto-web
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x mobile-app/android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: mobile-app/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p dist-apk
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/VaraKoto.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaraKoto-Android-APK
          path: dist-apk/VaraKoto.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: VaraKoto Android App v1.0.0
          body: |
            ### 🚗 VaraKoto.com অ্যান্ড্রয়েড মোবাইল অ্যাপ্লিকেশন (অফিসিয়াল APK)
            
            - **ভার্সন**: v1.0.0
            - **সাপোর্ট**: Android 7.0+ (Nougat থেকে Android 15/16)
            - **ফিচারস**:
              - ⚡ রিয়েলটাইম ৫-সেকেন্ড ক্যানভাস রোড অ্যানিমেশন (৬০ FPS)
              - 🚌 বাস, রিকশা, সিএনজি ও বাইক ভাড়া ক্যালকুলেটর
              - 📍 হাই-অ্যাকিউরেসি জিপিএস কারেন্ট লোকেশন ডিটেকশন
              - 📳 বাটন ও ভেইকল সিলেকশনে নেটিভ টাচ হ্যাপটিক্স
              - 📲 হোয়াটসঅ্যাপ ও বন্ধুদের সাথে সরাসরি ভাড়া শেয়ার
              - 🌓 প্রিমিয়াম ডার্ক ও লাইট থিম
          files: dist-apk/VaraKoto.apk
