name: Build Android Mobile App (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - 'src/frontend/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: 'android-build'
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/frontend/varakoto-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/frontend/varakoto-web
        run: npm ci

      - name: Build Web Application
        working-directory: src/frontend/varakoto-web
        run: npx ng build --configuration production

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project
        working-directory: src/frontend/varakoto-web
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x mobile-app/android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: varakoto-android-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
