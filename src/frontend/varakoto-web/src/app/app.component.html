<!-- Fullscreen Loading Screen Preview (if active) -->
@if (showLoadingPreview()) {
  <app-loading-screen [active]="true" [fullscreen]="true"></app-loading-screen>
  <button class="dismiss-loading-btn" (click)="toggleLoadingPreview()" title="Dismiss Loading Preview">
    ✕ বন্ধ করুন
  </button>
}

<div class="vk-app-layout">
  <!-- Minimalist Header -->
  <header class="vk-header">
    <div class="header-container">
      <app-logo variant="compact" size="sm"></app-logo>

      <div class="header-actions">
        <!-- Preview Loading Screen Button -->
        <button type="button" class="action-btn preview-btn" (click)="toggleLoadingPreview()" title="লোডিং স্ক্রিন দেখুন">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          <span class="btn-text">লোডিং অ্যানিমেশন</span>
        </button>

        <!-- Theme Toggle Button -->
        <button type="button" class="action-btn theme-btn" (click)="toggleTheme()" [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
          @if (themeService.isDark()) {
            <!-- Sun Icon -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFC93C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="1" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="btn-text">লাইট</span>
          } @else {
            <!-- Moon Icon -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#0B4F44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="btn-text">ডার্ক</span>
          }
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Showcase -->
  <main class="vk-main-content">
    <div class="content-container">
      <!-- Brand Identity Hero Showcase -->
      <section class="brand-hero-card">
        <app-logo variant="primary" size="lg" [showTagline]="true"></app-logo>
      </section>

      <!-- Color Tokens Reference Card -->
      <section class="palette-card">
        <h2 class="card-title">কালার প্যালেট (Brand Colors)</h2>
        <div class="swatches-grid">
          <div class="swatch-item">
            <div class="swatch color-green"></div>
            <div class="swatch-label">Forest Green</div>
            <div class="swatch-hex">#0B4F44</div>
          </div>
          <div class="swatch-item">
            <div class="swatch color-orange"></div>
            <div class="swatch-label">Vibrant Orange</div>
            <div class="swatch-hex">#E5570A</div>
          </div>
          <div class="swatch-item">
            <div class="swatch color-yellow"></div>
            <div class="swatch-label">Sunny Yellow</div>
            <div class="swatch-hex">#FFC93C</div>
          </div>
          <div class="swatch-item">
            <div class="swatch color-cream"></div>
            <div class="swatch-label">Warm Cream</div>
            <div class="swatch-hex">#FFF6E5</div>
          </div>
          <div class="swatch-item">
            <div class="swatch color-slate"></div>
            <div class="swatch-label">Slate Dark</div>
            <div class="swatch-hex">#17302B</div>
          </div>
        </div>
      </section>

      <!-- Logo Variants Preview -->
      <section class="variants-card">
        <h2 class="card-title">লোগো ভ্যারিয়েন্ট (Logo Variants)</h2>
        <div class="variants-grid">
          <div class="variant-box">
            <span class="variant-badge">STACKED</span>
            <app-logo variant="stacked" size="md"></app-logo>
          </div>
          <div class="variant-box">
            <span class="variant-badge">APP ICON</span>
            <div class="app-icon-wrapper">
              <app-logo variant="icon-only" size="md"></app-logo>
            </div>
          </div>
          <div class="variant-box">
            <span class="variant-badge">COMPACT</span>
            <app-logo variant="compact" size="sm"></app-logo>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
