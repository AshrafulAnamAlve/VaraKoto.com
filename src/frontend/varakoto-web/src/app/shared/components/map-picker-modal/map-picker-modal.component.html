@if (isOpen()) {
  <div class="map-modal-backdrop" (click)="close()" role="dialog" aria-modal="true">
    <div class="map-modal-card" (click)="$event.stopPropagation()">
      <!-- Modal Header -->
      <header class="modal-header">
        <div class="header-content">
          <span class="header-icon">📍</span>
          <div>
            <h2 class="header-title">{{ title() }}</h2>
            <p class="header-subtitle">ম্যাপে যে স্থানে যেতে চান সেখানে ট্যাপ করুন ({{ fieldLabel() }})</p>
          </div>
        </div>
        <button type="button" class="close-btn" (click)="close()" title="বন্ধ করুন">✕</button>
      </header>

      <!-- Map Body -->
      <div class="map-wrapper">
        <div #mapContainer class="leaflet-map-host"></div>

        <!-- Floating GPS Button -->
        <button
          type="button"
          class="floating-gps-btn"
          (click)="detectUserLocation()"
          [disabled]="isDetectingGps()"
          title="আমার বর্তমান অবস্থান"
        >
          @if (isDetectingGps()) {
            <span class="gps-spinner"></span>
          } @else {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="3"></circle>
              <line x1="12" y1="2" x2="12" y2="5"></line>
              <line x1="12" y1="19" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="5" y2="12"></line>
              <line x1="19" y1="12" x2="22" y2="12"></line>
            </svg>
            <span>আমার লোকেশন</span>
          }
        </button>

        <!-- Floating Helper Banner -->
        <div class="map-instruction-pill">
          💡 ম্যাপের যেকোনো জায়গায় ট্যাপ বা পিন ড্র্যাগ করে স্থান নির্বাচন করুন
        </div>
      </div>

      <!-- Footer Info & Confirmation -->
      <footer class="modal-footer">
        <div class="location-summary">
          <label class="summary-label">চিহ্নিত স্থানের নাম (প্রয়োজনে পরিবর্তন করুন):</label>
          <div class="name-input-wrapper">
            <input
              type="text"
              class="place-name-input"
              [ngModel]="placeName()"
              (ngModelChange)="placeName.set($event)"
              placeholder="স্থানের নাম লিখুন..."
            />
            @if (isReverseGeocoding()) {
              <span class="detect-spinner" title="ঠিকানা শনাক্ত হচ্ছে..."></span>
            }
          </div>
          <div class="coords-badge">
            জিপিএস: {{ currentLat().toFixed(4) }}, {{ currentLng().toFixed(4) }}
          </div>
        </div>

        <div class="footer-actions">
          <button type="button" class="btn-cancel" (click)="close()">বাতিল</button>
          <button type="button" class="btn-confirm" (click)="confirmSelection()">
            <span>এই স্থান নির্বাচন করুন</span>
            <span class="btn-check">✓</span>
          </button>
        </div>
      </footer>
    </div>
  </div>
}
