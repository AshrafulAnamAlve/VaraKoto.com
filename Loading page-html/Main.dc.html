body{margin:0;background:#FFF6E5;font-family:'Baloo Da 2',system-ui,sans-serif}
.hb{animation:bob 1.8s ease-in-out infinite;transform-origin:130px 318px}
.shadow{animation:shadow 1.8s ease-in-out infinite;transform-origin:130px 322px}
.arm{animation:scratch .45s ease-in-out infinite alternate;transform-origin:100px 192px}

.drop{animation:drop 2.4s ease-in infinite}
.carb{animation:carb .7s ease-in-out infinite}
.qm{opacity:0;animation:qm 3s ease-in infinite;transform-box:fill-box;transform-origin:center}
.q2{animation-delay:-1s}
.q3{animation-delay:-2s}
.tag{animation:swing 2.4s ease-in-out infinite;transform-origin:320px 112px}
.p1{animation:p1 6s linear infinite}
.p2{opacity:0;animation:p2 6s linear infinite}
.bulb{opacity:0;animation:bulb 6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.msg{position:absolute;left:0;right:0;top:0;text-align:center;opacity:0;animation:msg 6s ease-in-out infinite backwards}
.m2{animation-delay:2s}
.m3{animation-delay:4s}
.dash{animation:dash .5s linear infinite}
.drive{animation:drive 3.2s linear infinite}
.cloud{animation:drift 22s linear infinite}
.c2{animation-duration:30s;animation-delay:-12s}
.rise{opacity:0;animation:rise .8s ease-out .15s forwards}
@keyframes bob{
0%,100%{transform:translateY(0) rotate(-1deg)}
50%{transform:translateY(-6px) rotate(1deg)}
}
@keyframes shadow{
0%,100%{transform:scaleX(1);opacity:.14}
50%{transform:scaleX(.88);opacity:.08}
}
@keyframes scratch{
from{transform:rotate(-5deg)}
to{transform:rotate(5deg)}
}
@keyframes look{
0%,100%{transform:translateX(-3px)}
50%{transform:translateX(4px)}
}
@keyframes drop{
0%{opacity:0;transform:translateY(0)}
20%{opacity:1}
100%{opacity:0;transform:translateY(22px)}
}
@keyframes carb{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-1.5px)}
}
@keyframes qm{
0%{opacity:0;transform:translateY(10px) scale(.6) rotate(-10deg)}
20%{opacity:1}
70%{opacity:1;transform:translateY(-14px) scale(1) rotate(8deg)}
100%{opacity:0;transform:translateY(-26px) scale(1.05) rotate(12deg)}
}
@keyframes swing{
0%,100%{transform:rotate(-8deg)}
50%{transform:rotate(8deg)}
}
@keyframes p1{
0%,46%{opacity:1}
50%,100%{opacity:0}
}
@keyframes p2{
0%,50%{opacity:0}
56%,94%{opacity:1}
100%{opacity:0}
}
@keyframes bulb{
0%,74%{opacity:0;transform:scale(.2)}
82%{opacity:1;transform:scale(1.25)}
88%,94%{opacity:1;transform:scale(1)}
100%{opacity:0;transform:scale(.2)}
}
@keyframes msg{
0%{opacity:0;transform:translateY(10px)}
4%,28%{opacity:1;transform:translateY(0)}
33%,100%{opacity:0;transform:translateY(-10px)}
}
@keyframes dash{
from{background-position:0 0}
to{background-position:-36px 0}
}
@keyframes drive{
from{left:-14%}
to{left:100%}
}
@keyframes drift{
from{transform:translateX(-140px)}
to{transform:translateX(1500px)}
}
@keyframes rise{
from{opacity:0;transform:translateY(16px)}
to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
.hb,.shadow,.arm,.look,.drop,.carb,.qm,.tag,.p1,.p2,.bulb,.msg,.dash,.drive,.cloud,.rise{animation:none}
.qm,.p1,.m1,.rise{opacity:1}
.drive{left:40%}
}
</style>
